[project]
name = "agent-skills"
version = "0.1.0"
description = "Validation and publishing tooling for BC Gov agent skill profiles."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "yamllint>=1.38.0",
]

[tool.uv]
package = false

[tool.ruff]
# Two-space indentation across all Python in this repo.
indent-width = 2
line-length = 88
target-version = "py312"

[tool.ruff.format]
# Match the indent width above and keep a consistent quote/line-ending style.
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, D: pydocstyle (docstrings),
# UP: pyupgrade, B: bugbear. The D rules enforce that every module and function
# carries a docstring.
select = ["E", "W", "F", "I", "D", "UP", "B"]

[tool.ruff.lint.pydocstyle]
# Google convention disables the mutually-conflicting docstring rules
# (e.g. D203/D211, D212/D213) so formatting stays unambiguous.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document behaviour through descriptive names and a docstring per test,
# so the module-level docstring rule is the only one we require there.
"tests/*" = ["D104"]
